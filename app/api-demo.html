<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Social — API Demo</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell"><section class="section"><p class="eyebrow">DEVELOPMENT</p><h1>Client Social API demo</h1><p class="muted">Use this page to exercise the signup/login/job flow once the API is deployed at the same origin or configured through <code>window.CLIENT_SOCIAL_API</code>.</p><form id="signup-form"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password (8+ chars)" required><input name="display_name" placeholder="Your name"><input name="client_name" placeholder="Workspace name"><button class="button primary" type="submit">Create account</button></form><form id="login-form"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="button" type="submit">Log in</button></form><p id="auth-message" class="muted"></p></section><section class="section"><h2>Create publishing job</h2><form id="job-form"><input name="source_file_url" type="url" placeholder="Media URL" required><input name="title" placeholder="Title"><textarea name="description" placeholder="Description"></textarea><label><input name="youtube" type="checkbox" checked> YouTube</label><label><input name="instagram" type="checkbox" checked> Instagram</label><button class="button primary" type="submit">Queue job</button></form><p id="job-message" class="muted"></p></section><section class="section"><h2>Jobs</h2><div id="job-list"><div class="empty"><strong>Log in to load jobs</strong></div></div></section></main><script src="./app.js"></script></body></html>
