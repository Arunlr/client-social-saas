services:
  - type: web
    name: client-social-saas
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_BASE_URL
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: MAKE_CALLBACK_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
